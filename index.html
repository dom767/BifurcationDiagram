<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Logistic bifurcation diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <canvas id="view" aria-label="Logistic map bifurcation diagram"></canvas>
    <div class="overlay" id="overlay">
      <header class="hud">
        <p class="eyebrow">Bifurcation diagram</p>
        <h1 class="hud-title">Logistic map</h1>
        <p class="hud-hint" id="hud-hint">Drag to pan · scroll or pinch to zoom · double-click to reset</p>
      </header>
      <div class="minimap-stack" id="minimap-stack">
        <div class="minimap" id="minimap" aria-hidden="true">
          <canvas id="minimap-canvas"></canvas>
        </div>
        <div class="minimap-readout hidden" id="minimap-readout" aria-live="polite">r=—</div>
      </div>
      <div class="status hidden" id="status" role="status" aria-live="polite"></div>
      <div class="resolution" id="resolution" aria-live="polite">— × —</div>
      <aside class="settings-panel" id="settings" aria-label="Diagram settings">
        <p class="eyebrow">Settings</p>
        <div class="setting">
          <label class="setting-label" for="iterations-per-frame">Iterations per frame</label>
          <div class="setting-row">
            <input type="range" id="iterations-per-frame" min="1" max="256" step="1" value="64" />
            <output class="setting-value" id="iterations-per-frame-value" for="iterations-per-frame">64</output>
          </div>
        </div>
        <div class="setting">
          <label class="setting-label" for="total-frames">Total frames</label>
          <div class="setting-row">
            <input type="range" id="total-frames" min="1" max="65536" step="1" value="2000" />
            <output class="setting-value" id="total-frames-value" for="total-frames">2000</output>
          </div>
        </div>
        <div class="setting">
          <label class="setting-label" for="horizontal-scale">Horizontal scale</label>
          <div class="setting-row">
            <input type="range" id="horizontal-scale" min="0.25" max="100" step="0.05" value="1" />
            <output class="setting-value" id="horizontal-scale-value" for="horizontal-scale">1.00×</output>
          </div>
          <p class="setting-hint">Relative stretch of the current view; above 1× magnifies horizontally.</p>
        </div>
        <div class="setting">
          <label class="setting-label" for="brightness">Brightness</label>
          <div class="setting-row">
            <input type="range" id="brightness" min="0" max="1000" step="1" value="667" />
            <output class="setting-value" id="brightness-value" for="brightness">1.00</output>
          </div>
        </div>
        <div class="setting">
          <label class="setting-label" for="colour-palette">Colour</label>
          <div class="setting-row">
            <select id="colour-palette" class="setting-select" aria-label="Colour palette"></select>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
